name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        working-directory: port

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
          cache-dependency-path: 'port/go.mod'

      - name: Verify Code Formatting
        if: runner.os != 'Windows'
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files require formatting:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Static Analysis (go vet)
        run: go vet ./...

      - name: Build Module
        run: go build -v ./...

      - name: Run Test Suite (Unit & Regression Corpus)
        run: go test -v -count=1 ./...

      - name: Fuzz Smoke Test (FuzzCompile 5s)
        run: go test -v -fuzz=FuzzCompile -fuzztime=5s .
